name: Build and Release

# 触发方式：
#   1) 推送 v*.*.* 形式的 tag（如 v1.0.0）→ 构建 + 自动创建 Release 并上传安装包
#   2) 手动触发（Actions 页面点 Run workflow）→ 只构建，产出为 Artifact，不发 Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # ⚠ 刻意**不覆盖** Electron 与 electron-builder 的下载镜像。
    #
    # 踩过的坑：一开始这里把镜像改成了 GitHub 官方地址，想着"Runner 就在 GitHub 网络上，
    # 少一跳更快"。结果 v1.0.0 的构建在 CI 上失败（测试全过、只有打包这步挂），
    # 而本地完全正常。原因：electron-builder 的各构件走**不同的 URL 拼接规则**
    # （nsis / nsis-resources 是一套，7zip-win-x64.tar.gz 又是另一套），
    # 换基址会让其中一部分指到不存在的路径。
    #
    # 现在直接用项目 .npmrc 里配好的 npmmirror —— 这套配置已经用
    # **清空 electron-builder 缓存后重新构建**实测通过（nsis、7zip、nsis-resources
    # 三个构件都能正常下载并完成打包），保持本地与 CI 完全一致。
    #
    # 另外也不要在这里设 npm 缓存目录：`${{ runner.temp }}` 这个上下文在 job 级
    # env 里**不可用**，写上去会让整个工作流在解析阶段就失败，
    # 表现为"跑了 0 秒、一个 job 都没有"（这个坑也实际踩过）。

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 用 npm ci 而不是 npm install：严格按 package-lock.json 安装，构建可复现
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 全部离线测试，不接触真实校园网，不需要任何账号或密钥
      - name: 运行测试
        run: npm test

      - name: 构建 Windows 安装包
        run: npm run build

      - name: 生成校验和
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 dist\SHA256SUMS.txt
            Write-Host "$($_.Name)  $hash"
          }
          Get-Content dist\SHA256SUMS.txt

      - name: 上传构建产物（手动触发时可在此下载）
        uses: actions/upload-artifact@v4
        with:
          name: YZU-CampusNet-Auto-Setup
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # 只有推送 tag 时才发 Release。
      # 刻意不上传源码压缩包、node_modules、日志或任何本地配置。
      - name: 创建 Release 并上传安装包
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
