# Gradle 构建参数（与 Android Studio 向导生成的一致）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 使用 AndroidX（不使用早已废弃的 support 库）
android.useAndroidX=true

# Kotlin 官方代码风格
kotlin.code.style=official

# ── 退出 AGP 9 的内置 Kotlin，改用我们自己指定版本的 Kotlin 插件 ──
#
# 为什么需要：
#   AGP 9.4.1 内置的 Kotlin 编译器是 2.2.x，只能读 Kotlin 元数据版本 ≤2.3。
#   而 quickjs-kt（我们的 JS 引擎）是用 Kotlin 2.4 编译的，元数据版本 2.4.0 →
#   编译器直接报 "was compiled with an incompatible version of Kotlin"，
#   并连带喷出一堆假的 Unresolved reference。
#
#   把 kotlin-stdlib 降级**解决不了**这个问题（试过）：问题在库自己的 class 元数据，
#   不在 stdlib。正确做法是把编译器升到 2.4.x，与库对齐。
#
# 代价：需要在 build.gradle.kts 里显式声明 Kotlin 插件版本（见两个 build 文件）。
android.builtInKotlin=false

# ── 退出 AGP 9 的新 DSL ──
#
# 为什么连这个也要退：
#   `org.jetbrains.kotlin.android` 插件与 AGP 9 的新 DSL 不兼容，构建时会报
#   "The 'org.jetbrains.kotlin.android' plugin is not compatible with AGP's 9.0 new DSL"。
#   而上面那条（builtInKotlin=false）又必须用外部 Kotlin 插件，否则升不了编译器版本。
#
#   两条路二选一：
#     (a) builtInKotlin=true + 新 DSL  → 编译器被锁在 2.2.x，读不了 quickjs-kt 的 2.4 元数据 ✗
#     (b) builtInKotlin=false + newDsl=false + 外部 Kotlin 2.4.10 → 可行 ✓
#
# ⚠ 已知代价：AGP 说 builtInKotlin 开关会在 **AGP 10 移除**。
#   到那时要么等 AGP 内置编译器跟上 2.4+，要么换掉 JS 引擎。
#   记录在 android/CORE_BOUNDARY.md 的"已知风险"里。
android.newDsl=false
